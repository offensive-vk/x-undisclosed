name: CI / Docker

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-latest
    name: Build Image
    steps:
    - uses: actions/checkout@v5
    - name: Build the Docker Image
      run: docker build . --file Dockerfile -t portfolio:${{ github.sha }}

  call-ghcr-workflow:
    uses: offensive-vk/Assets/.github/workflows/ghcr.yml@master
    with:
      author: "Vedansh"
      title: "x-undisclosed"
      description: "My personal website thingy made using Astro, react and tailwindcss."
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
