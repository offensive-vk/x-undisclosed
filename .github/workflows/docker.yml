name: CI / Docker

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-latest
    name: Build Image
    steps:
    - uses: actions/checkout@v5
    - name: Build the Docker Image
      run: docker build . --file Dockerfile -t my-portfolio:${{ github.sha }}