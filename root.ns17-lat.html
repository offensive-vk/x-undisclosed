<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi // NS17.LAT // CLASSIFIED</title>
    <meta name="author" content="OG" />
    <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0d0d0d;
            color: #d8d8d8; 
            font-family: 'Share+Tech+Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .welcome-container {
            text-align: center;
            border: 2px solid #222;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Major+Mono+Display', monospace;
            font-size: 3em;
            margin-bottom: 10px;
            color: #eee;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1em;
            color: #888;
            margin-bottom: 25px;
        }

        .ip-display {
            font-size: 0.9em;
            color: #555;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1>NS17.LAT</h1>
        <div class="subtitle">Oh, hello!</div>
        
        <div class="ip-display">
            Who are you?<br>
            <span id="user-ip">...</span>
        </div>
    </div>

    <script>
        // Use a free API to get the user's public IP address.
        // We make a dynamic request for this.
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-ip').textContent = data.ip;
            })
            .catch(error => {
                console.error("Error fetching IP address:", error);
                document.getElementById('user-ip').textContent = "Unavailable";
            });
        console.log(`Yup, I know you are here buddy. - {VN5B4309VA8}`);
    </script>
</body>
</html>
